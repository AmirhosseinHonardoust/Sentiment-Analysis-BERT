name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check --select E,F,I,B,SIM,UP --line-length 100 src/ tests/

      - name: Black (format check)
        run: black --check --line-length 100 src/ tests/

      - name: Mypy (type check)
        run: mypy --ignore-missing-imports src/

      - name: Pytest
        # BERT tests are skipped automatically when transformers/torch weight
        # downloads aren't available; see tests/conftest.py.
